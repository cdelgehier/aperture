---
name: Commitizen Push Check

on:
  push:
    branches-ignore:
      - main

jobs:
  check-commit:
    name: Check commit message
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check commit message
        run: uvx --from commitizen cz check --message "${{ github.event.head_commit.message }}"
