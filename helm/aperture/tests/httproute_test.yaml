suite: httproute
templates:
  - templates/httproute.yaml
tests:
  - it: does not create an httproute by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an httproute for an existing gateway
    set:
      gatewayApi.httpRoute.enabled: true
      gatewayApi.httpRoute.hostnames:
        - aperture.example.test
      gatewayApi.httpRoute.parentRefs:
        - name: shared-gateway
          namespace: platform
          sectionName: https
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.hostnames[0]
          value: aperture.example.test
      - equal:
          path: spec.parentRefs[0].name
          value: shared-gateway
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
