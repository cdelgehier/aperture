suite: ingress
templates:
  - templates/ingress.yaml
tests:
  - it: does not create an ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ingress when enabled
    set:
      ingress.enabled: true
      ingress.className: nginx
      ingress.annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      ingress.hosts:
        - host: aperture.example.test
          paths:
            - path: /
              pathType: Prefix
      ingress.tls:
        - secretName: aperture-tls
          hosts:
            - aperture.example.test
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/force-ssl-redirect"]
          value: "true"
      - equal:
          path: spec.rules[0].host
          value: aperture.example.test
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
      - equal:
          path: spec.tls[0].secretName
          value: aperture-tls
