suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: uses a rolling update strategy and graceful shutdown defaults
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value:
            - sleep
            - "5"

  - it: exposes health probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: RELEASE-NAME-aperture-env
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /app/settings.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: wires existing api key secret
    set:
      auth.mode: api_key
      auth.apiKeys.existingSecret: aperture-api-keys
      auth.apiKeys.existingSecretKey: APT_API_KEYS
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APT_API_KEYS
            valueFrom:
              secretKeyRef:
                name: aperture-api-keys
                key: APT_API_KEYS

  - it: uses prod replica count and configured image tag
    values:
      - ../values-prod.yaml
    set:
      image.tag: test-tag
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/cdelgehier/aperture:test-tag

  - it: renders topology spread constraints from prod values
    values:
      - ../values-prod.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
