suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: creates a service account by default
    asserts:
      - isKind:
          of: ServiceAccount

  - it: renders workload identity annotations
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/aperture-irsa-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::ACCOUNT:role/aperture-irsa-role

  - it: does not create a service account when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
