apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aperture.fullname" . }}-env
  labels:
    {{- include "aperture.labels" . | nindent 4 }}
data:
  APT_SERVICE_NAME: {{ .Values.aperture.serviceName | quote }}
  APT_LISTEN_ADDR: {{ .Values.aperture.listenAddr | quote }}
  APT_PORT: {{ .Values.aperture.port | quote }}
  APT_LOG_LEVEL: {{ .Values.aperture.logLevel | quote }}
  APT_REDIS_URL: {{ .Values.redis.url | quote }}
  APT_CACHE_BACKEND: {{ .Values.aperture.cacheBackend | quote }}
  APT_CACHE_DEFAULT_TTL_SECONDS: {{ .Values.aperture.cacheDefaultTtlSeconds | quote }}
  APT_AUTH_MODE: {{ .Values.auth.mode | quote }}
  APT_API_KEY_HEADER: {{ .Values.auth.apiKeyHeader | quote }}
